# Base44 sandbox/dev environment for KK Trust Phones.
#
# One development service running the repo straight from the bind mount:
#   - Node/Express server (server/index.js) serving the static pages and the
#     sign-in + phone-listing APIs, with `node --watch` for live reload.
#   - Dependencies are installed from package-lock.json on startup into a named
#     volume, so source edits never need an image rebuild.
#
# Usage: docker compose -f docker-compose.base44.yml up -d
services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Browser-facing origin, used to build the Google OAuth redirect URI: behind
      # the preview proxy the request host is the internal sandbox host, not the
      # URL the shopper's browser is actually on.
      - APP_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    # Platform-managed secrets (Google OAuth credentials, session signing key).
    # Listed last so the user's dashboard values always win.
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - npm ci --omit=dev --no-audit --no-fund && exec node --watch server/index.js
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || (echo 'web: homepage not responding'; exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  node_modules:
