<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage phones | KK Trust Phones</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #0d47a1;
            color: white;
            padding: 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .logo a {
            color: inherit;
            text-decoration: none;
        }

        nav {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .who {
            margin-left: auto;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .who img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .wrap {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px 60px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel h1,
        .panel h2 {
            color: #0d47a1;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form label {
            display: block;
            margin-bottom: 15px;
            font-size: 14px;
            color: #333;
        }

        .form input {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background: #ff6f00;
            color: white;
            border: 0;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn.ghost {
            background: white;
            color: #0d47a1;
            border: 1px solid #0d47a1;
        }

        .btn.danger {
            background: #b71c1c;
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn.small {
            padding: 8px 16px;
            font-size: 14px;
            background: #0d47a1;
        }

        .list {
            list-style: none;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }

        .row:first-child {
            border-top: 0;
        }

        .row img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
            flex-shrink: 0;
        }

        .row h3 {
            font-size: 17px;
            color: #222;
        }

        .row .price {
            color: #ff6f00;
            font-weight: bold;
        }

        .row .grow {
            flex: 1;
            min-width: 0;
        }

        .row .row-actions {
            display: flex;
            gap: 8px;
        }

        .status {
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .status.ok {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .status.bad {
            background: #ffebee;
            color: #b71c1c;
        }

        .empty {
            color: #777;
        }

        footer {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo"><a href="/">KK Trust Phones</a></div>
        <nav>
            <a href="/">Home</a>
            <a href="/#products">Products</a>
            <a href="/#contact">Contact</a>
            <span class="who" id="who"></span>
        </nav>
    </header>

    <main class="wrap">
        <div class="status" id="status" hidden></div>

        <section class="panel">
            <h1 id="form-title">Add a phone</h1>
            <form class="form" id="form">
                <label>Phone name
                    <input id="name" maxlength="120" placeholder="Samsung Galaxy S24" required>
                </label>
                <label>Price
                    <input id="price" maxlength="60" placeholder="UGX 2,500,000">
                </label>
                <label>Image link
                    <input id="image" maxlength="500" placeholder="https://example.com/phone.jpg">
                </label>
                <div class="actions">
                    <button class="btn" type="submit" id="submit">Add phone</button>
                    <button class="btn ghost" type="button" id="cancel" hidden>Cancel edit</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Current listings (<span id="count">0</span>)</h2>
            <ul class="list" id="list"></ul>
        </section>
    </main>

    <footer>
        <p>© 2026 KK Trust Phones. All Rights Reserved.</p>
    </footer>

    <script>
        const form = document.getElementById('form');
        const formTitle = document.getElementById('form-title');
        const submitButton = document.getElementById('submit');
        const cancelButton = document.getElementById('cancel');
        const nameInput = document.getElementById('name');
        const priceInput = document.getElementById('price');
        const imageInput = document.getElementById('image');
        const listElement = document.getElementById('list');
        const countElement = document.getElementById('count');
        const statusElement = document.getElementById('status');

        let editingId = null;

        function showStatus(message, ok = true) {
            statusElement.textContent = message;
            statusElement.className = `status ${ok ? 'ok' : 'bad'}`;
            statusElement.hidden = false;
        }

        function readError(data, fallback) {
            return (data && data.error) || fallback;
        }

        function renderUser(user) {
            const who = document.getElementById('who');
            who.textContent = '';

            if (user.picture) {
                const avatar = document.createElement('img');
                avatar.src = user.picture;
                avatar.alt = '';
                who.appendChild(avatar);
            }

            const label = document.createElement('span');
            label.textContent = user.name || user.email;
            who.appendChild(label);

            const signOut = document.createElement('button');
            signOut.className = 'btn small';
            signOut.type = 'button';
            signOut.textContent = 'Sign out';
            signOut.addEventListener('click', async () => {
                await fetch('/auth/logout', { method: 'POST' });
                location.href = '/';
            });
            who.appendChild(signOut);
        }

        function renderListings(listings) {
            countElement.textContent = String(listings.length);
            listElement.textContent = '';

            if (listings.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'empty';
                empty.textContent = 'No phones yet — add the first one above.';
                listElement.appendChild(empty);
                return;
            }

            for (const listing of listings) {
                const row = document.createElement('li');
                row.className = 'row';

                const image = document.createElement('img');
                image.src = listing.image || '';
                image.alt = listing.name;
                row.appendChild(image);

                const details = document.createElement('div');
                details.className = 'grow';

                const title = document.createElement('h3');
                title.textContent = listing.name;
                details.appendChild(title);

                const price = document.createElement('p');
                price.className = 'price';
                price.textContent = listing.price || 'Ask for the price';
                details.appendChild(price);

                row.appendChild(details);

                const actions = document.createElement('div');
                actions.className = 'row-actions';

                const editButton = document.createElement('button');
                editButton.className = 'btn small';
                editButton.type = 'button';
                editButton.textContent = 'Edit';
                editButton.addEventListener('click', () => startEditing(listing));
                actions.appendChild(editButton);

                const deleteButton = document.createElement('button');
                deleteButton.className = 'btn danger';
                deleteButton.type = 'button';
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', () => removeListing(listing));
                actions.appendChild(deleteButton);

                row.appendChild(actions);
                listElement.appendChild(row);
            }
        }

        async function loadListings() {
            const response = await fetch('/api/listings');
            const data = await response.json();
            renderListings(data.listings || []);
        }

        function startEditing(listing) {
            editingId = listing.id;
            formTitle.textContent = 'Edit phone';
            submitButton.textContent = 'Save changes';
            cancelButton.hidden = false;
            nameInput.value = listing.name || '';
            priceInput.value = listing.price || '';
            imageInput.value = listing.image || '';
            nameInput.focus();
        }

        function stopEditing() {
            editingId = null;
            formTitle.textContent = 'Add a phone';
            submitButton.textContent = 'Add phone';
            cancelButton.hidden = true;
            form.reset();
        }

        async function removeListing(listing) {
            if (!confirm(`Delete ${listing.name}?`)) return;

            const response = await fetch(`/api/listings/${listing.id}`, { method: 'DELETE' });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showStatus(readError(data, 'Could not delete that phone.'), false);
                return;
            }

            stopEditing();
            await loadListings();
            showStatus(`Deleted ${listing.name}.`);
        }

        cancelButton.addEventListener('click', stopEditing);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                name: nameInput.value,
                price: priceInput.value,
                image: imageInput.value,
            };

            const response = await fetch(editingId ? `/api/listings/${editingId}` : '/api/listings', {
                method: editingId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showStatus(readError(data, 'Could not save that phone.'), false);
                return;
            }

            const savedName = data.listing ? data.listing.name : payload.name;
            const wasEditing = Boolean(editingId);
            stopEditing();
            await loadListings();
            showStatus(wasEditing ? `Saved ${savedName}.` : `Added ${savedName}.`);
        });

        fetch('/api/me')
            .then((response) => response.json())
            .then(async (data) => {
                if (!data.user) {
                    location.replace('/login?next=%2Fmanage');
                    return;
                }
                renderUser(data.user);
                await loadListings();
            })
            .catch(() => showStatus('Could not reach the server. Please reload the page.', false));
    </script>

</body>

</html>
